<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nueva dirección · desgramatizador</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://moncholate.github.io/desgramatizador/">
<script>
(function () {
  var MAPA = {"Kachai":"kachai","Liveboard":"liveboard","Chasquibox":"teachers-toolbox","teachers-utility-belt":"teachers-toolbox","Grammar-HUB":"grammar-hub","GramMaster":"grammaster","DesGramatizador":"desgramatizador","Question-Lab":"question-lab"};
  var p = location.pathname;
  for (var viejo in MAPA) {
    if (p === '/' + viejo || p.indexOf('/' + viejo + '/') === 0) {
      var resto = p.slice(viejo.length + 1) || '/';
      var ir = function () { location.replace('/' + MAPA[viejo] + resto + location.search + location.hash); };
      if (!('serviceWorker' in navigator)) return ir();
      var listo = false, salir = function () { if (!listo) { listo = true; ir(); } };
      setTimeout(salir, 800);
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.filter(function (r) {
          return new URL(r.scope).pathname.indexOf('/' + viejo + '/') === 0;
        }).map(function (r) { return r.unregister(); }));
      }).then(salir, salir);
      return;
    }
  }
})();</script>
